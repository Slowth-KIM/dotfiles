# Terminal settings
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Prefix key
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split panes
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Reload config
unbind r
bind r source-file ~/.tmux.conf\; display-message "Config reloaded."

# Session list sorted by time
bind s choose-tree -Zs -O time

# Window numbering starts at 1
set -g base-index 1

# Status bar position
set -g status-position top

# Catppuccin theme (pinned to v0.3.0)
set -g @plugin 'catppuccin/tmux#v0.3.0'
set -g @catppuccin_flavor 'mocha'

# Catppuccin window separators
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_modules_right "null"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_default "on"

# Pane resizing
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# Vim mode and mouse
set -g mode-keys vi
set -g mouse on
set-window-option -g mode-keys vi

# Copy mode vi bindings
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Performance
set -sg escape-time 10
set -g focus-events on

# Passthrough for image.nvim
set -gq allow-passthrough on
set -g visual-activity off

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'

# Continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# Yazi passthrough
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Extended keys support
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'tmux*:extkeys'
set -s extended-keys-format csi-u
